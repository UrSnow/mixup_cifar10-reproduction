# conda env create -f environment.yml && conda activate mixup-repro
# Versions match the Colab runtime that produced results/ (Python 3.13, torch 2.11.0, CUDA 13.0 on a
# Tesla T4; full list in results/main/test_results.json). Rebuilding the paper from results/ needs
# only numpy and matplotlib; building the PDF also needs a TeX distribution with IEEEtran.
name: mixup-repro
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.1.3
  - matplotlib=3.10.0
  - pip
  - pip:
      # The default PyPI wheel; on Linux it includes CUDA. Bit-identical training is only expected
      # on the same GPU and software as the original runs.
      - torch==2.11.0
      - torchvision==0.26.0
